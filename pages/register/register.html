<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Rector Hub</title>
    <meta name="description" content="Create your Rector Hub account to shop faster and track orders.">
    <link rel="canonical" href="register.html">
    
    <!-- Shared Design System & Icons -->
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="register.css">

    <!-- Supabase SDK & Database Wrapper -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-client.js" defer></script>

    <!-- Shared Auth Logic -->
    <script src="../../js/auth.js" defer></script>
    
    <!-- Page Specific JS -->
    <script src="register.js" defer></script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>

<body class="register-page page-wrapper">
    <header>
        <nav class="navbar">
            <a href="../home/home.html" class="navbar-logo">
                <img src="../../images/logo.png" alt="Rector Hub Logo" onerror="this.style.display='none'">
                <span>RECTOR <span class="logo-accent">HUB</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="../home/home.html">Home</a></li>
                <li><a href="../shop/shop.html">Shop</a></li>
                <li id="admin-nav-link" class="hidden"><a href="../admin/admin.html">Admin</a></li>
                <li id="logout-nav-link" class="hidden"><a href="#" id="logout-btn" class="logout-btn">Logout</a></li>
                <li><a href="../about/about.html">About</a></li>
                <li><a href="../contact/contact.html">Contact</a></li>
            </ul>
            <div class="nav-right">
                <a href="../login/login.html" class="auth-btn">Login</a>
                <button class="hamburger" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h1>Create Account</h1>
                    <p>Join Rector Hub today</p>
                </div>
                
                <form id="register-form">
                    <div class="form-group">
                        <label for="name"><i class="fas fa-user"></i> Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="name" placeholder="Enter your name" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> Phone</label>
                        <div class="input-wrapper">
                            <input type="tel" id="phone" placeholder="Enter your phone number" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Create password" required>
                            <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm"><i class="fas fa-lock"></i> Confirm Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirm" placeholder="Confirm password" required>
                            <button type="button" class="toggle-password" data-target="confirm" aria-label="Toggle confirm password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <p id="error" class="error-message"></p>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="register-btn">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="../login/login.html">Login</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-yellow-bar"></div>
        <div class="footer-links">
            <a href="../contact/contact.html">Contact</a>
            <a href="../privacy/privacy.html">Privacy Policy</a>
            <a href="../terms/terms.html">Terms</a>
            <a href="../returns/returns.html">Returns</a>
        </div>
        <p>&copy; 2024 Rector Hub (Pajay Gadgets). 3rd Floor Tycoon Plaza, Spera N Deo, Abakaliki. All rights reserved.</p>
    </footer>
</body>

</html>
